name: Netlify Deploy Status

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-status:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Netlify deploy to finish
        run: |
          echo "Waiting for Netlify deploy..."
          for i in {1..10}; do
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
              https://api.netlify.com/api/v1/sites/${{ secrets.NETLIFY_SITE_ID }}/deploys?per_page=1)

            STATE=$(echo "$RESPONSE" | jq -r '.[0].state')
            echo "Deploy state: $STATE"

            if [ "$STATE" = "ready" ]; then
              exit 0
            fi

            if [ "$STATE" = "error" ]; then
              echo "Netlify deploy failed"
              exit 1
            fi

            sleep 30
          done

          echo "Timed out waiting for Netlify deploy"
          exit 1
