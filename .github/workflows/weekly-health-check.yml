name: Weekly Netlify Health Check (Vite)

on:
  schedule:
    # Every Monday at 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check site availability
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" ${{ secrets.SITE_URL }})
          echo "HTTP status: $STATUS"
          [ "$STATUS" -eq 200 ]

      - name: Verify Vite build assets are served
        run: |
          HTML=$(curl -s ${{ secrets.SITE_URL }})
          echo "$HTML" | grep -q "/assets/" || (
            echo "Vite assets not found — build may be broken"
            exit 1
          )

      - name: Check latest Netlify deploy status
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            https://api.netlify.com/api/v1/sites/${{ secrets.NETLIFY_SITE_ID }}/deploys?per_page=1)

          STATE=$(echo "$RESPONSE" | jq -r '.[0].state')
          echo "Latest deploy state: $STATE"

          [ "$STATE" = "ready" ]
